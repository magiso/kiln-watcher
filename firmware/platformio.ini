; Kiln Watcher sensor firmware. See PLAN.md.
;   pio run -e esp32 -t upload     build and flash the board
;   pio device monitor             USB serial logs (115200)
;   pio test -e native             unit tests for lib/ on this computer

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32@8.0.0  ; Arduino-ESP32 core 3.3 (built-in CA bundle)
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv  ; 3 MB app, no OTA: Wi-Fi + TLS fill 90% of the default 1.25 MB
build_flags = -Wall -Wextra
; Unit tests run natively only.
test_ignore = *

; Desk test: posts to `npm run dev -- -H 0.0.0.0` on this computer (dev:kiln: keys), never production.
;   DEV_HOST=<computer-ip> pio run -e desk -t upload
[env:desk]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -D API_URL_OVERRIDE=\"http://${sysenv.DEV_HOST}:3000/api/readings\"

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
; main.cpp needs Arduino; tests exercise lib/ only.
build_src_filter = -<*>
