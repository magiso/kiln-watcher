<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln Empty — Desktop</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=DM+Sans:wght@500;700&amp;display=swap">

<div style="flex: 1 1 340px; min-width: 0; display: flex; justify-content: center">

<circle cx="118" cy="132" r="100" fill="#FFB5C8" style="mix-blend-mode: multiply"></circle>
<circle cx="228" cy="112" r="80" fill="#C9B8F5" style="mix-blend-mode: multiply"></circle>

<rect x="108" y="66" width="102" height="108" rx="8" fill="none" stroke="#2F2A4A" stroke-width="4" stroke-dasharray="10 9"></rect>
<path d="M159 98 L159 142 M137 120 L181 120" stroke="#2F2A4A" stroke-width="6" stroke-linecap="round"></path>
</svg>
</div>
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 14px; font-weight: 700; letter-spacing: 0.14em">KILN STATUS</span>
<h1 style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(88px, 11vw, 168px); line-height: 0.9">EMPTY.</h1>
<p style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; max-width: 30ch">All clear and ready for the next load. Shelve your pieces!</p>
</div>
</main>
</div>
</div>
</x-dc>
